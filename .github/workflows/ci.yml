name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel

      - name: cargo test
        working-directory: kernel
        run: cargo test

      - name: cargo clippy
        working-directory: kernel
        run: cargo clippy -- -D warnings
