name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel

      - name: cargo test
        working-directory: kernel
        run: set -o pipefail && cargo test 2>&1 | tee /tmp/kernel-test.log

      - name: documented test counts match executed tests
        run: scripts/check-doc-counts.sh /tmp/kernel-test.log

      - name: phase4 calib smoke (fixtures)
        working-directory: kernel
        run: cargo run --release --bin phase4_calib -- --json

      - name: phase4 model roundtrip smoke
        working-directory: kernel
        run: |
          cargo run --release --bin phase4_calib -- \
            --write-model /tmp/ci_ntg.calib \
            --write-sparse /tmp/ci_ntg.sparse \
            --write-report /tmp/ci_ntg.json \
            --json
          cargo run --release --bin phase4_calib -- --eval-model /tmp/ci_ntg.calib --json
          cargo run --release --bin phase4_calib -- \
            --eval-model /tmp/ci_ntg.calib \
            --predict 'fn main() {}' --sparse-score
          test -s /tmp/ci_ntg.calib && test -s /tmp/ci_ntg.sparse && test -s /tmp/ci_ntg.json

      - name: density bench smoke
        working-directory: kernel
        run: cargo run --release --bin density_bench

      - name: cargo clippy (all targets)
        working-directory: kernel
        run: cargo clippy --all-targets -- -D warnings

      - name: ternary vs f32 benchmark (correctness check only, no timings)
        working-directory: kernel
        run: cargo bench --bench ternary_vs_f32 -- --check

  keymaster-backend:
    name: Keymaster backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/keymaster

      - name: cargo test
        working-directory: backend/keymaster
        run: cargo test --release

      - name: cargo clippy
        working-directory: backend/keymaster
        run: cargo clippy -- -D warnings

  whole-stack:
    name: Whole-stack smoke (dashboard + kernel_host + keymaster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel
            dashboard
            backend/keymaster
            hostframe-backend

      - name: build all crates
        run: scripts/build-all.sh --no-test

      - name: smoke (Ollama optional, skipped when absent)
        env:
          SKIP_BUILD: "1"
        run: scripts/smoke-whole.sh
