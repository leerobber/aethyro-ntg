name: Deploy Phase F L0 — VITASCALE Hostframe

on:
  push:
    branches:
      - claude/merge-aetherflux-zero-prs-5h10zg
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (plan only, no apply)'
        required: false
        default: 'false'

env:
  GCP_PROJECT: aethyro-ntg
  GCP_REGION: us-central1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./hostframe-backend
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/ntg-kernel/ntg-kernel:${{ env.IMAGE_TAG }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/ntg-kernel/ntg-kernel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.5

      - name: Enable GCP APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            container.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            bigquery.googleapis.com \
            storage.googleapis.com \
            cloudkms.googleapis.com

      - name: Terraform Init
        working-directory: ./deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=aethyro-ntg-tfstate" \
            -backend-config="prefix=phase-f-l0"

      - name: Terraform Plan
        working-directory: ./deploy/terraform
        run: |
          terraform plan \
            -var="project_id=${{ env.GCP_PROJECT }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="image_tag=${{ env.IMAGE_TAG }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./deploy/terraform
        if: github.event_name == 'push' && github.event.inputs.dry_run != 'true'
        run: |
          terraform apply tfplan

      - name: Get Cloud Run URL
        working-directory: ./deploy/terraform
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cloud Run Service" >> $GITHUB_STEP_SUMMARY
          terraform output -raw keymaster_url >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GKE Cluster" >> $GITHUB_STEP_SUMMARY
          terraform output -raw gke_cluster_name >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Registry" >> $GITHUB_STEP_SUMMARY
          terraform output -raw artifact_registry >> $GITHUB_STEP_SUMMARY
