[package]
name = "aethyro-ntg-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
memmap2 = "0.9"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.7"

[lib]
name = "ntg_kernel"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kernel_host"
path = "src/main.rs"

